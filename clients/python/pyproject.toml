[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skizzy"
version = "0.1.0"
description = "Python sync client for skizzy-protocol, the JSON-RPC-over-WebSocket control protocol for Kerbal Space Program"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = ["websockets>=12"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["skizzy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
