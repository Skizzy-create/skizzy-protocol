<title>Skizzy Command</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a combat-information-centre console. Docked panels around one live plot; the plot is the brightest thing on screen, panels recede. */
:root{
  color-scheme: dark;
  /* surfaces: blue-green slate, dimmed like a darkened CIC */
  --ink-0:#071013;      /* app ground */
  --ink-1:#0c171b;      /* panels */
  --ink-2:#12222828;    /* hover wash (alpha) */
  --ink-3:#162a31;      /* raised controls */
  --line:#1d333b;
  --line-hi:#2a4a55;
  --sea:#081519;
  --grid:#10242b;
  --grid-hi:#173540;
  --text:#d3e0e4;
  --text-dim:#7f979f;
  --text-faint:#4f666e;
  /* affiliation (MIL-STD-2525 hues, tuned for a dark plot; shape always carries the same meaning) */
  --friend:#62c6f2;
  --hostile:#ff6a57;
  --unknown:#e9c84f;
  --neutral:#7cd68e;
  /* operator accent: selection, your controls, things you own */
  --accent:#b5a3ff;
  /* state */
  --ok:#59d09a; --warn:#f0a43a; --crit:#ff4b4b;
  /* type */
  --font-display:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --font-ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --fs-xs:10.5px; --fs-s:12px; --fs-m:13px; --fs-l:15px;
  --lw:300px; --rw:310px; --bh:190px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink-0);color:var(--text);font:var(--fs-m)/1.4 var(--font-ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;display:grid;gap:0;
  grid-template-columns:var(--lw) 6px minmax(0,1fr) 6px var(--rw);
  grid-template-rows:auto minmax(0,1fr) 6px var(--bh);
  grid-template-areas:"top top top top top" "left sl map sr right" "left sl hs sr right" "left sl bot sr right";}
.app.no-left{--lw:0px}.app.no-right{--rw:0px}.app.no-bot{--bh:0px}
.app.no-left .left,.app.no-right .right,.app.no-bot .bot{display:none}
.app.no-left .sl,.app.no-right .sr,.app.no-bot .hs{pointer-events:none;opacity:0}

/* top bar */
.top{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:0 2px 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font:700 15px/1 var(--font-display);letter-spacing:.14em;text-transform:uppercase}
.brand span{font:500 var(--fs-s)/1 var(--font-ui);color:var(--text-dim)}
.ut{font:500 var(--fs-l)/1 var(--font-data);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ut small{display:block;font:500 9.5px/1 var(--font-display);letter-spacing:.16em;color:var(--text-faint);margin-bottom:3px}
.grp{display:flex;align-items:center;gap:4px}
.seg{display:inline-flex;border:1px solid var(--line-hi);border-radius:4px;overflow:hidden}
.seg button{background:transparent;border:0;padding:4px 8px;font:500 var(--fs-s)/1.2 var(--font-data);color:var(--text-dim);font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink-3);color:var(--text)}
.seg button:hover{color:var(--text)}
.btn{background:var(--ink-3);border:1px solid var(--line-hi);border-radius:4px;padding:4px 10px;font:500 var(--fs-s)/1.2 var(--font-ui);color:var(--text)}
.btn:hover{border-color:var(--text-faint)}
.btn.ghost{background:transparent}
.btn.acc{border-color:color-mix(in srgb,var(--accent) 60%,transparent);color:var(--accent)}
.btn[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,var(--ink-3));border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font:600 10.5px/1.2 var(--font-display);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line-hi);white-space:nowrap}
.pill.war{color:var(--hostile);border-color:color-mix(in srgb,var(--hostile) 50%,transparent);background:color-mix(in srgb,var(--hostile) 9%,transparent)}
.pill.seat{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.lbl{font:600 9.5px/1 var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}
.spacer{flex:1}
.tsel{background:var(--ink-3);border:1px solid var(--line-hi);border-radius:4px;padding:3px 6px;font-size:var(--fs-s)}
.unit input{background:var(--ink-3);border:1px solid var(--line-hi);border-radius:4px;padding:4px 8px;font-size:var(--fs-s);min-width:0;flex:1}
.chip b{font:600 10px/1 var(--font-data);color:var(--accent);margin-right:5px}

/* panels */
.panel{background:var(--ink-1);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.left{grid-area:left}.right{grid-area:right}.bot{grid-area:bot}
.ph{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
.ph h2{margin:0;font:600 11px/1 var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim)}
.ph .x{margin-left:auto;background:none;border:0;color:var(--text-faint);font-size:15px;line-height:1;padding:0 2px}
.ph .x:hover{color:var(--text)}
.pb{overflow:auto;min-height:0;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
.chip{background:transparent;border:1px solid var(--line-hi);border-radius:999px;padding:2px 9px;font:500 11px/1.4 var(--font-ui);color:var(--text-dim)}
.chip[aria-pressed="true"]{color:var(--text);background:var(--ink-3);border-color:var(--text-faint)}
.chip i{font-style:normal;font-family:var(--font-data);color:var(--text-faint);margin-left:4px}

/* splitters */
.sl{grid-area:sl}.sr{grid-area:sr}.hs{grid-area:hs}
.sl,.sr{cursor:col-resize}.hs{cursor:row-resize}
.sl,.sr,.hs{position:relative;touch-action:none}
.sl::after,.sr::after{content:"";position:absolute;inset:40% 2px;border-radius:2px;background:var(--line)}
.hs::after{content:"";position:absolute;inset:2px 46%;border-radius:2px;background:var(--line)}
.sl:hover::after,.sr:hover::after,.hs:hover::after{background:var(--accent)}

/* map */
.mapwrap{grid-area:map;position:relative;min-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sea)}
#plot{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
#plot.grab{cursor:grabbing}
.mtool{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:calc(100% - 20px);
  background:color-mix(in srgb,var(--ink-1) 88%,transparent);border:1px solid var(--line);border-radius:6px;padding:6px 8px;backdrop-filter:blur(6px)}
.mtool select{background:var(--ink-3);border:1px solid var(--line-hi);border-radius:4px;padding:3px 6px;font-size:var(--fs-s)}
.mtool input[type=range]{width:84px;accent-color:var(--accent)}
.tg{background:transparent;border:1px solid var(--line-hi);border-radius:4px;padding:3px 8px;font:500 11.5px/1.2 var(--font-ui);color:var(--text-dim)}
.tg[aria-pressed="true"]{color:var(--text);background:var(--ink-3);border-color:var(--text-faint)}
.sep{width:1px;height:18px;background:var(--line-hi)}
.tip{position:absolute;pointer-events:none;z-index:4;background:color-mix(in srgb,var(--ink-1) 94%,transparent);border:1px solid var(--line-hi);border-radius:5px;padding:6px 8px;font:var(--fs-xs)/1.45 var(--font-data);white-space:nowrap;font-variant-numeric:tabular-nums}
.tip b{font:600 12px/1.3 var(--font-ui);display:block}
.banner{position:absolute;left:50%;top:58px;transform:translateX(-50%);z-index:5;display:flex;gap:12px;align-items:center;
  background:color-mix(in srgb,var(--crit) 14%,var(--ink-1));border:1px solid color-mix(in srgb,var(--crit) 55%,transparent);border-radius:6px;padding:8px 12px;max-width:calc(100% - 24px)}
.banner span{font:500 var(--fs-s)/1.35 var(--font-ui)}
.banner b{font:600 10.5px/1 var(--font-display);letter-spacing:.14em;color:var(--crit);text-transform:uppercase;display:block;margin-bottom:3px}
.toast{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:6;background:color-mix(in srgb,var(--accent) 14%,var(--ink-1));border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);border-radius:6px;padding:8px 12px;font:500 var(--fs-s)/1.35 var(--font-ui);max-width:min(560px,calc(100% - 24px));text-align:center}
.legend{position:absolute;right:10px;bottom:50px;background:color-mix(in srgb,var(--ink-1) 90%,transparent);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:var(--fs-xs)/1.3 var(--font-ui);color:var(--text-dim)}
.legend canvas{display:block}

/* timeline */
.tl{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;align-items:center;pointer-events:none}
.tl > *{pointer-events:auto}
.tlbox{flex:1;position:relative;height:30px;background:color-mix(in srgb,var(--ink-1) 88%,transparent);border:1px solid var(--line);border-radius:6px;padding:0 10px;display:flex;align-items:center}
.tlbox input{width:100%;accent-color:var(--accent);position:relative;z-index:1}
#ticks{position:absolute;left:10px;right:10px;top:3px;height:6px}
.tlt{font:500 11px/1 var(--font-data);color:var(--text-dim);font-variant-numeric:tabular-nums;min-width:62px}

/* tracks table */
table{border-collapse:collapse;width:100%;font:var(--fs-xs)/1.3 var(--font-data);font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--ink-1);text-align:left;font:600 9.5px/1 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);padding:7px 6px;border-bottom:1px solid var(--line);z-index:1}
td{padding:4px 6px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);white-space:nowrap}
td.n{text-align:right}th.n{text-align:right}
tr{cursor:pointer}
tbody tr:hover{background:var(--ink-2)}
tr.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.sw{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:0}
.sw.friend{background:var(--friend);border-radius:50%}
.sw.hostile{background:var(--hostile);transform:rotate(45deg) scale(.85)}
.sw.unknown{background:var(--unknown);border-radius:2px}
.sw.dead{background:var(--text-faint)}

/* unit panel */
.unit{padding:10px 12px;display:flex;flex-direction:column;gap:12px}
.uh{display:flex;gap:10px;align-items:center}
.uh canvas{flex:none}
.uh h3{margin:0;font:600 18px/1.1 var(--font-display);letter-spacing:.02em}
.uh p{margin:2px 0 0;color:var(--text-dim);font-size:var(--fs-s)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cstate{font:600 10.5px/1.2 var(--font-display);letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:4px;border:1px solid var(--line-hi);color:var(--text-dim)}
.cstate.manual{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.cstate.agent{color:var(--friend);border-color:color-mix(in srgb,var(--friend) 45%,transparent)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px}
.kv div{display:flex;flex-direction:column;gap:3px;min-width:0}
.kv b{font:500 var(--fs-m)/1.1 var(--font-data);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.sec{display:flex;flex-direction:column;gap:6px}
.mag{display:grid;grid-template-columns:52px 1fr 54px;gap:8px;align-items:center;font:var(--fs-xs)/1 var(--font-data);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--ink-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--friend)}
.bar.dmg i{background:var(--warn)}
.mag .r{text-align:right;color:var(--text-dim)}
.win{color:var(--crit)}
.note{color:var(--text-faint);font-size:11px}

/* bottom tabs */
.tabs{display:flex;gap:2px}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;padding:2px 8px 4px;font:600 11px/1 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tab i{font-style:normal;font-family:var(--font-data);font-size:10px;color:var(--hostile);margin-left:4px}
.log{list-style:none;margin:0;padding:0;font:var(--fs-xs)/1.35 var(--font-data)}
.log li{display:grid;grid-template-columns:66px 74px minmax(0,1fr);gap:8px;padding:4px 10px;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent);cursor:pointer}
.log li:hover{background:var(--ink-2)}
.log .t{color:var(--text-faint);font-variant-numeric:tabular-nums}
.log .c{font:600 9.5px/1.5 var(--font-display);letter-spacing:.12em;text-transform:uppercase}
.log .m{font-family:var(--font-ui);font-size:12px;color:var(--text);white-space:normal}
.c-contact{color:var(--unknown)}.c-weapons{color:var(--friend)}.c-intercept{color:var(--ok)}.c-damage{color:var(--crit)}.c-orders{color:var(--accent)}.c-comms{color:var(--text-dim)}
.comms{display:grid;grid-template-rows:minmax(0,1fr) auto;height:100%}
.msg{padding:6px 10px;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.msg .who{font:600 11.5px/1.3 var(--font-ui)}
.msg .who small{font:400 10.5px var(--font-data);color:var(--text-faint);margin-left:6px}
.msg .body{font:13px/1.45 var(--font-ui);max-width:72ch}
.msg.red .who{color:var(--hostile)}.msg.blue .who{color:var(--friend)}.msg.you .who{color:var(--accent)}
.unv{font:600 9.5px/1 var(--font-display);letter-spacing:.12em;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);border-radius:3px;padding:2px 5px;margin-left:6px;text-transform:uppercase}
.compose{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.compose select,.compose input{background:var(--ink-3);border:1px solid var(--line-hi);border-radius:4px;padding:4px 8px;font-size:var(--fs-s)}
.compose input{flex:1;min-width:0}
.loss{display:grid;grid-template-columns:1fr 1fr;gap:0}
.loss section{padding:10px 12px}
.loss section+section{border-left:1px solid var(--line)}
.loss h4{margin:0 0 8px;font:600 11px/1 var(--font-display);letter-spacing:.16em;text-transform:uppercase}
.loss dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0;font:var(--fs-xs)/1.3 var(--font-data);font-variant-numeric:tabular-nums}
.loss dt{color:var(--text-dim)}.loss dd{margin:0;text-align:right}

@media (max-width:820px){
  body{overflow:auto;height:auto}
  html{height:auto}
  .app{display:flex;flex-direction:column;height:auto;gap:8px}
  .top{order:-2}.mapwrap{order:-1;height:62svh;min-height:360px}
  .sl,.sr,.hs{display:none}
  .left .pb{max-height:320px}.right .pb{max-height:none}.bot{height:340px}
  .app.no-left .left,.app.no-right .right,.app.no-bot .bot{display:none}
  .legend{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><b>Skizzy Command</b><span>Kerbin Strait · air raid on Task Group 1 · sample scenario</span></div>
    <div class="ut"><small>Universal time (Kerbin)</small><span id="ut">Y1 D014 03:12:00</span></div>
    <div class="grp" role="group" aria-label="Time">
      <button class="btn" id="play" aria-label="Pause">❚❚</button>
      <div class="seg" id="speeds"></div>
      <button class="btn ghost" id="reset">Restart</button>
    </div>
    <span class="pill war" title="Side stance">Blue ↔ Red · War</span>
    <button class="btn" id="rtbAllTop" title="Send every Blue aircraft home to land on Kestrel. Click twice to confirm.">RTB all</button>
    <div class="grp" role="group" aria-label="Blue posture"><span class="lbl">Blue posture</span><div class="seg" id="posture"><button data-p="Defensive" aria-pressed="false">Defensive</button><button data-p="Proactive" aria-pressed="true">Proactive</button></div></div>
    <div class="grp"><label class="lbl" for="ffSel">Friendly fire</label><select id="ffSel" class="tsel"><option value="0">Off</option><option value="0.001" selected>1 in 1,000 missiles</option><option value="0.01">1 in 100 missiles</option></select></div>
    <span class="pill seat" id="seatPill">Blue seat · You</span>
    <button class="btn ghost" id="seatBtn">Hand seat to agent</button>
    <span class="spacer"></span>
    <div class="grp" role="group" aria-label="Panels">
      <span class="lbl">Panels</span>
      <button class="tg" data-panel="left" aria-pressed="true">Tracks</button>
      <button class="tg" data-panel="right" aria-pressed="true">Unit</button>
      <button class="tg" data-panel="bot" aria-pressed="true">Log</button>
      <button class="btn ghost" id="resetLayout" title="Restore the default panel sizes">Reset layout</button>
    </div>
  </header>

  <aside class="panel left" aria-label="Tracks">
    <div class="ph"><h2>Tracks</h2><span class="note" id="trackCount"></span><button class="x" data-close="left" aria-label="Hide tracks">×</button></div>
    <div class="chips" id="groupChips" aria-label="Select a whole group"></div>
    <div class="chips" id="trackChips"></div>
    <div class="pb"><table><thead><tr><th>Track</th><th>Type</th><th class="n">Brg</th><th class="n">Rng km</th><th class="n">Alt</th><th class="n">m/s</th></tr></thead><tbody id="trackBody"></tbody></table></div>
  </aside>
  <div class="sl" data-split="lw" role="separator" aria-orientation="vertical" aria-label="Resize tracks panel" tabindex="0"></div>

  <main class="mapwrap" id="mapwrap">
    <canvas id="plot" aria-label="Tactical plot"></canvas>
    <div class="mtool" role="toolbar" aria-label="Plot controls">
      <label class="lbl" for="sizeMode">Symbols</label>
      <select id="sizeMode">
        <option value="auto">Auto: radar size, no overlap</option>
        <option value="rcs">Radar size only</option>
        <option value="zoom">Grow with zoom</option>
        <option value="fixed">Fixed size</option>
      </select>
      <input type="range" id="sizeMul" min="0.6" max="1.8" step="0.05" value="1" aria-label="Symbol scale">
      <span class="sep"></span>
      <button class="tg" data-t="trails" aria-pressed="true">Trails</button>
      <button class="tg" data-t="stalks" aria-pressed="true">Altitude</button>
      <button class="tg" data-t="lines" aria-pressed="false">Target lines</button>
      <button class="tg" data-t="rings" aria-pressed="true">Rings</button>
      <button class="tg" data-t="labels" aria-pressed="true">Labels</button>
      <button class="tg" data-t="counts" aria-pressed="false" title="Optional: group missiles and drones into counts">Counts</button>
      <span class="sep"></span>
      <button class="tg" id="zout" aria-label="Zoom out">−</button>
      <button class="tg" id="zin" aria-label="Zoom in">+</button>
      <button class="tg" id="fit" title="Fit all (F)">Fit</button>
    </div>
    <div class="banner" id="banner" hidden><div><b>Paused on event</b><span id="bannerText"></span></div><button class="btn" id="resume">Resume</button></div>
    <div class="tip" id="tip" hidden></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="legend" id="legend"><canvas id="legendCv" width="208" height="70" aria-label="Symbol key"></canvas></div>
    <div class="tl"><span class="tlt" id="tlTime">T+0:00</span><div class="tlbox"><canvas id="ticks"></canvas><input type="range" id="scrub" min="0" max="0" value="0" aria-label="Replay position"></div><button class="btn acc" id="live" aria-pressed="true">Live</button></div>
  </main>

  <div class="sr" data-split="rw" role="separator" aria-orientation="vertical" aria-label="Resize unit panel" tabindex="0"></div>
  <aside class="panel right" aria-label="Unit">
    <div class="ph"><h2>Unit</h2><button class="x" data-close="right" aria-label="Hide unit panel">×</button></div>
    <div class="pb" id="unit"></div>
  </aside>

  <div class="hs" data-split="bh" role="separator" aria-orientation="horizontal" aria-label="Resize log panel" tabindex="0"></div>
  <section class="panel bot" aria-label="Log">
    <div class="ph">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="log" aria-selected="true">Messages</button>
        <button class="tab" role="tab" data-tab="comms" aria-selected="false">Comms<i id="unread"></i></button>
        <button class="tab" role="tab" data-tab="loss" aria-selected="false">Losses</button>
      </div>
      <button class="x" data-close="bot" aria-label="Hide log">×</button>
    </div>
    <div class="chips" id="logChips"></div>
    <div class="pb" id="botBody"></div>
  </section>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const cs=getComputedStyle(document.documentElement);
const tok=n=>cs.getPropertyValue(n).trim();
const COL={friend:tok('--friend'),hostile:tok('--hostile'),unknown:tok('--unknown'),accent:tok('--accent'),sea:tok('--sea'),grid:tok('--grid'),gridHi:tok('--grid-hi'),
  text:tok('--text'),dim:tok('--text-dim'),faint:tok('--text-faint'),crit:tok('--crit'),warn:tok('--warn'),ok:tok('--ok'),ink:tok('--ink-0'),line:tok('--line-hi')};
const F_DATA=tok('--font-data'),F_UI=tok('--font-ui'),F_DISP=tok('--font-display');
function rgba(hex,a){const h=hex.replace('#','');const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h.slice(0,6),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- deterministic rng ---------- */
let seed=11;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}

/* ---------- classes ---------- */
const K={
  cvn:{domain:'surf',rcs:40000,glyph:'CV',cls:'Carrier',spd:.008},
  ddg:{domain:'surf',rcs:9000,glyph:'DD',cls:'Destroyer',spd:.008},
  ssn:{domain:'sub',rcs:300,glyph:'SS',cls:'Attack submarine',spd:.006},
  aew:{domain:'air',rcs:60,glyph:'AEW',cls:'Early warning aircraft',spd:.16},
  ftr:{domain:'air',rcs:4,glyph:'F',cls:'Fighter',spd:.25},
  bmr:{domain:'air',rcs:25,glyph:'A',cls:'Strike aircraft',spd:.24},
  uav:{domain:'air',rcs:.15,glyph:'U',cls:'Attack drone',spd:.05},
  ucav:{domain:'air',rcs:.3,glyph:'U',cls:'Armed drone',spd:.09},
  asm:{domain:'air',rcs:.05,glyph:'',cls:'Anti-ship missile',spd:.29,missile:true},
  sam:{domain:'air',rcs:.08,glyph:'',cls:'Surface-to-air missile',spd:.9,missile:true},
  aam:{domain:'air',rcs:.03,glyph:'',cls:'Air-to-air missile',spd:.8,missile:true},
};
const UT0=13*21600+3*3600+12*60;
const CODE={cvn:'CVN',ddg:'DDG',ssn:'SSN',aew:'AEW',ftr:'FTR',bmr:'STK',uav:'UAV',ucav:'UCAV',asm:'ASM',sam:'SAM',aam:'AAM'};

/* ---------- state ---------- */
let objs,byId,nextId,simT,acc,events,log,comms,frames,lastFrame,stats,rep,paused,speed=4,firstLaunch,scriptIdx,seatAgent=false,replayIdx=null;
const view={cx:90,cy:0,scale:3};
const sel=new Set();let primary=null;
const opt={trails:true,stalks:true,lines:false,rings:true,labels:true,counts:false,sizeMode:'auto',sizeMul:1,ff:.001};

function add(o){o.id=nextId++;o.alive=true;o.trail=[];o.lastTrail=-9;o.sizeMul=1;o.cool=0;objs.push(o);byId.set(o.id,o);return o;}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const wrap=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;};
function steerTo(o,hd,rate,dt){const d=wrap(hd-o.hdg),m=rate*dt;o.hdg+=Math.max(-m,Math.min(m,d));}
const brgOf=(from,to)=>((90-Math.atan2(to.y-from.y,to.x-from.x)*180/Math.PI)%360+360)%360;
const hdgDeg=o=>((90-o.hdg*180/Math.PI)%360+360)%360;
const pad3=n=>String(Math.round(n)%360).padStart(3,'0');

function setup(){
  seed=11;alertDone=false;firstLaunchT=0;saidEscorts=false;objs=[];byId=new Map();nextId=1;simT=0;acc=0;events=[];log=[];comms=[];frames=[];lastFrame=-1;firstLaunch=false;scriptIdx=0;replayIdx=null;
  stats={exp:{blue:{'SM-2':0,ESSM:0,AAM:0,CIWS:0},red:{ASM:0,Drones:0}},lost:{blue:{},red:{}},intercepts:0,hits:0,ciws:0,ff:0};
  rep={};
  const ship=(kind,name,x,y,extra)=>add(Object.assign({side:'blue',kind,name,x,y,alt:0,hdg:.12,spd:K[kind].spd,hp:100,ctrl:'Mission',mission:'Sea control ALPHA',doctrine:'Free',emcon:'Active',st:[x,y]},extra));
  ship('cvn','Kestrel',0,0,{mag:{ESSM:[16,16],CIWS:[2,2]},channels:2,vip:true});
  ship('ddg','Halyard',14,9,{mag:{'SM-2':[32,32],ESSM:[8,8],CIWS:[1,1]},channels:4});
  ship('ddg','Bowline',14,-9,{mag:{'SM-2':[32,32],ESSM:[8,8],CIWS:[1,1]},channels:4});
  ship('ddg','Cleat',-11,2,{mag:{'SM-2':[24,24],ESSM:[8,8],CIWS:[1,1]},channels:3});
  ship('ssn','Tide',34,-30,{alt:-120,ctrl:'Agent',mission:'ASW screen (sub-agent)',mag:{Torpedo:[12,12]}});
  add({side:'blue',kind:'aew',name:'Watch 1',x:-25,y:28,alt:9000,hdg:0,spd:K.aew.spd,orbit:{x:-25,y:15,r:13},ctrl:'BDA',mission:'AEW orbit',fuel:.82});
  const flight=(n,kind,call,cx,cy,r,alt,mission,aam)=>{for(let i=0;i<n;i++)add({side:'blue',kind,name:call+' '+(i+1),x:cx+Math.cos(i*2.4)*r*.6,y:cy+Math.sin(i*2.4)*r*.6,alt:alt+i*60,hdg:Math.PI/2,spd:K[kind].spd,orbit:{x:cx,y:cy,r},aam,aamMax:aam,ctrl:'Mission',mission,group:mission,doctrine:'Free',onContact:'task',fuel:.75-(i%4)*.03});};
  flight(4,'ftr','Viper',62,8,12,6800,'CAP North',6);
  flight(4,'ftr','Cobra',55,-40,12,6200,'CAP South',6);
  flight(8,'ftr','Hawk',22,6,8,5200,'Escort',4);
  flight(24,'ucav','Wasp',38,26,6,1200,'Drone swarm',2);
  for(const o of objs)if(o.side==='blue'&&o.group==null)o.group=o.kind==='aew'?'AEW':(o.kind==='ssn'?'Submarine':'Surface group');
  let n=0;
  for(let g=0;g<4;g++){
    const cy=-54+g*36,cx=228+g*7;
    for(let i=0;i<10;i++){
      const kind=i<4?'bmr':'ftr';
      const o=add({side:'red',kind,name:'R'+(g+1)+'-'+String(i+1).padStart(2,'0'),x:cx+(rnd()-.5)*12,y:cy+(rnd()-.5)*12,
        alt:kind==='bmr'?1800+rnd()*2600:4500+rnd()*5000,hdg:0,spd:K[kind].spd+(rnd()-.5)*.02,idState:'unknown',group:g,state:kind==='bmr'?'ingress':'escort',
        asm:kind==='bmr'?8:0,pair:i>>1,off:(rnd()-.5)*.5,ctrl:'BDA'});
      o.hdg=Math.atan2(-o.y,-o.x);n++;
    }
  }
  for(let g=4;g<6;g++){const cy=g===4?95:-100,cx=215;for(let i=0;i<10;i++){const o=add({side:'red',kind:'ftr',name:'R'+(g+1)+'-'+String(i+1).padStart(2,'0'),x:cx+(rnd()-.5)*12,y:cy+(rnd()-.5)*12,
    alt:6000+rnd()*4000,hdg:0,spd:.27,idState:'unknown',group:g,state:'escort',asm:0,pair:i>>1,off:g===4?-.25:.25,ctrl:'BDA'});o.hdg=Math.atan2(-o.y,-o.x);}}
  for(let i=0;i<20;i++){const o=add({side:'red',kind:'uav',name:'D'+String(i+1).padStart(2,'0'),x:168+(i%5)*1.4+rnd(),y:112+Math.floor(i/5)*1.4+rnd(),alt:200+rnd()*300,spd:.05,idState:'unknown',group:9,ctrl:'Script'});o.hdg=Math.atan2(-o.y,-o.x-10);}
  for(let i=0;i<2;i++){const o=add({side:'red',kind:'ftr',name:'S-0'+(i+1),x:72+i*1.5,y:-98-i,alt:9500,hdg:0,spd:.24,idState:'unknown',group:8,state:'escort',asm:0,pair:i,off:.5,ctrl:'BDA',stealth:true,seen:false});o.hdg=Math.atan2(-o.y,-o.x);}
  logMsg('contact','New air contacts: 6 groups, 60 tracks, bearing 062–120, 215–240 km. Identity unknown.',230,0);
  logMsg('contact','Slow low contacts: 20 tracks in a tight block, bearing 056, 205 km. Identity unknown.',170,112);
  logMsg('orders','Sea control ALPHA active. Doctrine: weapons free against missiles, tight against aircraft.',0,0);
  sel.clear();primary=byId.get(1).id;sel.add(primary);
  paused=false;
}

/* ---------- logging ---------- */
function logMsg(cat,text,x,y){log.push({t:simT,cat,text,x,y});if(log.length>600)log.shift();dirtyBot=true;}
function event(type,x,y){events.push({t:simT,type,x,y});}
function sayComms(ch,who,side,text,unverified){comms.push({t:simT,ch,who,side,text,unv:!!unverified});unread++;logMsg('comms',`${who} (${ch}): ${text}`,null,null);dirtyBot=true;}
let unread=0,dirtyBot=true;

/* ---------- simulation ---------- */
const STEP=.1;
function simulate(dt){acc+=dt;let n=0;while(acc>=STEP&&n<400){step(STEP);acc-=STEP;n++;}}
function nearest(o,pred,maxD){let b=null,bd=maxD;for(const t of objs){if(!t.alive||t===o||!pred(t))continue;const d=dist(o,t);if(d<bd){bd=d;b=t;}}return b;}
const VIP_R=40;
const freeT=x=>!(x.engagedBy&&byId.get(x.engagedBy)?.alive);
const isMslThreat=x=>x.side==='red'&&(x.kind==='asm'||(x.kind==='uav'&&x.idState==='hostile'));
const PATROL_LEASH=55;
function sensorR(o){return o.kind==='ucav'?25:o.kind==='ftr'?45:0;}
// a hostile this unit can see with its own sensors: aircraft first, then missiles and attack drones
function contactTarget(o,excl){const R=sensorR(o);if(!R)return null;
  // aircraft only while it still has missiles; with an empty rack only the gun is left, which works against missiles and drones
  return (o.aam>0?nearest(o,x=>x.side==='red'&&(x.kind==='ftr'||x.kind==='bmr')&&x.idState==='hostile'&&x.id!==excl,R):null)||nearest(o,x=>isMslThreat(x)&&freeT(x)&&x.id!==excl,R*.6);}
const grpLogT={};
function ordLog(o,text){if(o.kind==='ucav'){const k=o.group;if(simT-(grpLogT[k]??-99)<20)return;grpLogT[k]=simT;logMsg('orders',`${k} (drones): ${text}.`,o.x,o.y);return;}logMsg('orders',`${o.name}: ${text}.`,o.x,o.y);}
// divert to a contact and fight it; returns false (and clears the diversion) when there is nothing to fight
function fightContact(o,dt,t,why){if(o.diverted!==t.id){const first=!o.diverted;o.diverted=t.id;if(first)ordLog(o,`${why} ${t.name}, ${dist(o,t).toFixed(0)} km`);}
  steerTo(o,Math.atan2(t.y-o.y,t.x-o.x),.55,dt);engageAir(o,t,dt);return true;}
function endDivert(o,text){if(o.diverted){o.diverted=null;ordLog(o,text);}}
// engage-on-contact while executing an order; refD = only divert for contacts closer than this
function onContact(o,dt,excl,refD){if(o.onContact!=='engage'||o.doctrine==='Hold'||K[o.kind].domain!=='air')return false;
  const c=contactTarget(o,excl);if(!c||(refD!=null&&dist(o,c)>=refD)){endDivert(o,'back on task');return false;}
  return fightContact(o,dt,c,'contact, engaging');}
function vipList(){return objs.filter(v=>v.alive&&v.vip&&v.side==='blue');}
function threatensVip(x,vips){if(x.side!=='red'||!x.alive)return false;if(x.kind==='asm')return !!byId.get(x.target)?.vip;
  if(x.kind==='bmr'||x.kind==='ftr'||x.kind==='uav')return x.idState==='hostile'&&vips.some(v=>dist(v,x)<VIP_R);return false;}
// target choice for blue fighters and drones: threats to VIPs first, then aircraft, then anti-ship missiles and attack drones when no aircraft are in view
function airTarget(o){const vips=vipList(),ucav=o.kind==='ucav';
  if(vips.length){const t=nearest(o,x=>threatensVip(x,vips)&&(x.kind!=='asm'||freeT(x)),ucav?60:120);if(t)return t;}
  const a=posture==='Proactive'
    ?(nearest(o,x=>x.side==='red'&&x.kind==='bmr'&&x.idState==='hostile'&&x.state!=='egress',230)||nearest(o,x=>x.side==='red'&&x.kind==='ftr'&&x.idState==='hostile',75))
    :nearest(o,x=>x.side==='red'&&(x.kind==='ftr'||x.kind==='bmr')&&x.idState==='hostile',75);
  if(a)return a;
  return nearest(o,x=>isMslThreat(x)&&freeT(x),ucav?45:80);}
// fire at a target: AAM in range, or the gun against missiles and drones up close
function engageAir(o,t,dt,cool){
  if(o.aam>0&&dist(o,t)<(o.kind==='ucav'?20:42)&&simT>o.cool&&freeT(t)){launch('aam',o,t,'AAM');o.aam--;stats.exp.blue.AAM++;o.cool=simT+(cool||3.5);report(o,'AAM',1);}
  if((t.kind==='asm'||t.kind==='uav')&&t.alive&&dist(o,t)<1.6&&rnd()<.25*dt){t.alive=false;stats.intercepts++;event('ciws',t.x,t.y);report(o,'Gun',1);
    logMsg('intercept',`${o.name} shot down ${t.kind==='asm'?'missile':'drone'} ${t.name} with its gun.`,t.x,t.y);}
}
const blueShips=()=>objs.filter(o=>o.alive&&o.side==='blue'&&(o.kind==='cvn'||o.kind==='ddg'));
function orbit(o,dt){const c=o.orbit,a=Math.atan2(o.y-c.y,o.x-c.x),d=Math.hypot(o.x-c.x,o.y-c.y);steerTo(o,a+Math.PI/2+(d-c.r)*.05,.35,dt);}
function launch(kind,from,target,weapon){
  const m=add({side:from.side,kind,name:kind==='asm'?weapon:shotName(from,weapon),x:from.x,y:from.y,alt:kind==='asm'?15:Math.max(30,from.alt||30),hdg:Math.atan2(target.y-from.y,target.x-from.x),spd:K[kind].spd,target:target.id,born:simT,shooter:from.id,weapon,ctrl:'BDA'});
  if(kind!=='asm')target.engagedBy=m.id;
  if(kind!=='asm'&&opt.ff>0&&rnd()<opt.ff)m.ff=true; // this one will lose its target and find a friend
  return m;
}
function shotName(from,weapon){from.shots=(from.shots||0)+1;const ab=from.name.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()+(from.name.replace(/\D/g,''));return `${ab}-${(weapon||'MSL').replace('-','')}-${String(from.shots).padStart(2,'0')}`;}
function alertLaunch(){alertDone=true;const c=byId.get(1);if(!c||!c.alive)return;
  for(let i=0;i<4;i++)add({side:'blue',kind:'ftr',name:'Lance '+(i+1),x:c.x+1+i*.4,y:c.y+(i-1.5)*.6,alt:4500+i*200,hdg:0,spd:.25,orbit:{x:45,y:i<2?18:-18,r:10},aam:6,aamMax:6,ctrl:'Mission',doctrine:'Free',onContact:'task',mission:'Alert intercept',group:'Alert',fuel:.95});
  logMsg('orders','Kestrel launched four alert fighters (Lance 1–4) to hit the strike aircraft before they reach launch range.',c.x,c.y);}
function killObj(o,how){o.alive=false;if(o.kind==='asm'||o.kind==='uav'||o.kind==='sam'||o.kind==='aam')return;const side=o.side;stats.lost[side][K[o.kind].cls]=(stats.lost[side][K[o.kind].cls]||0)+1;event('kill',o.x,o.y);logMsg('damage',`${o.name} (${K[o.kind].cls.toLowerCase()}) lost${how?': '+how:''}.`,o.x,o.y);}
function report(ship,key,n){(rep[ship.id]||(rep[ship.id]={}))[key]=((rep[ship.id]||{})[key]||0)+n;}

function think(o,dt){
  if(o._ord!==o.order){o._ord=o.order;o.diverted=null;}
  if(o.order&&doOrder(o,dt))return;
  if(o.ctrl==='Manual'&&!o.order)return;
  switch(o.kind){
  case 'aew':orbit(o,dt);o.fuel=Math.max(0,o.fuel-dt*.00004);break;
  case 'ftr':case 'ucav':
    if(o.side==='blue'){
      o.fuel=Math.max(0,o.fuel-dt*.00008);
      const t=o.doctrine==='Free'||o.doctrine==null?airTarget(o):null;
      if(t){steerTo(o,Math.atan2(t.y-o.y,t.x-o.x),.5,dt);engageAir(o,t,dt);}else{orbit(o,dt);if(o.doctrine==='Tight')selfDefend(o);}
    }else{
      if(o.state==='escort'){steerTo(o,Math.atan2(-o.y,-o.x)+o.off,.2,dt);
        const thr=objs.some(m=>m.alive&&m.kind==='aam'&&m.target===o.id)||nearest(o,x=>x.side==='blue'&&x.kind==='ftr',40);
        if(thr){o.state='break';o.breakHdg=o.hdg+(o.pair%2?1:-1)*(1.3+rnd()*.7);o.until=simT+16+rnd()*6;o.spd=.3;}
      }else if(o.state==='break'){steerTo(o,o.breakHdg,.32,dt);if(simT>o.until)o.state='engage';}
      else if(o.state==='engage'){const v=nearest(o,x=>x.side==='blue'&&x.kind==='ftr',120);if(v)steerTo(o,Math.atan2(v.y-o.y,v.x-o.x),.3,dt);else o.state='egress';if(simT>o.until+70)o.state='egress';}
      else{o.spd=.3;steerTo(o,o.off*.8,.25,dt);}
      if(o.x>330)o.alive=false;
    }break;
  case 'bmr':{
    const cv=byId.get(1),tgt=cv.alive?cv:blueShips()[0];
    if(o.state==='ingress'){steerTo(o,Math.atan2(-o.y,-o.x),.15,dt);if(tgt&&dist(o,tgt)<118&&o.asm>0){o.state='launch';o.cool=simT+rnd()*1.5;}}
    else if(o.state==='launch'){
      if(simT>o.cool&&o.asm>0){const ships=blueShips();if(ships.length){const r=rnd();const t=r<.4&&cv.alive?cv:ships[Math.floor(rnd()*ships.length)];launch('asm',o,t,'V'+String(stats.exp.red.ASM+1).padStart(3,'0'));o.asm--;stats.exp.red.ASM++;o.cool=simT+1.1;
        if(!firstLaunch){firstLaunch=true;onFirstLaunch(o);}}}
      if(o.asm<=0){o.state='egress';o.egress=(rnd()-.5)*1.6;o.spd=.27;}
    }else{steerTo(o,o.egress,.22,dt);if(o.x>330)o.alive=false;}
  }break;
  case 'uav':{const c=byId.get(4);const t=c&&c.alive?c:nearest(o,x=>x.side==='blue'&&(x.kind==='ddg'||x.kind==='cvn'),999);if(!t)break;
    steerTo(o,Math.atan2(t.y-o.y,t.x-o.x),.4,dt);if(dist(o,t)<.5){impact(o,t,9+rnd()*6);}}break;
  case 'asm':{let t=byId.get(o.target);if(!t||!t.alive){const n=nearest(o,x=>x.side==='blue'&&(x.kind==='ddg'||x.kind==='cvn'),999);if(!n){o.alive=false;break;}o.target=n.id;t=n;}
    steerTo(o,Math.atan2(t.y-o.y,t.x-o.x),.6,dt);if(dist(o,t)<.35)impact(o,t,20+rnd()*12);}break;
  case 'sam':case 'aam':{let t=byId.get(o.target);
    if(o.ff&&!o.ffDone&&simT-o.born>3){const f=nearest(o,x=>x.side===o.side&&x.id!==o.shooter&&!K[x.kind].missile,25);
      if(f){if(t&&t.engagedBy===o.id)t.engagedBy=null;o.target=f.id;o.ffDone=true;t=f;}}
    if(!t||!t.alive){const n=nearest(o,x=>x.side!==o.side&&(o.kind==='sam'?(x.kind==='asm'||x.kind==='uav'||x.kind==='ftr'||x.kind==='bmr'):(x.kind==='ftr'||x.kind==='bmr'||x.kind==='asm'||x.kind==='uav'))&&(!x.stealth||x.seen)&&!(x.engagedBy&&byId.get(x.engagedBy)?.alive),14);
      if(!n){o.alive=false;break;}o.target=n.id;n.engagedBy=o.id;t=n;}
    steerTo(o,Math.atan2(t.y-o.y,t.x-o.x),3,dt);
    if(simT-o.born>(o.kind==='sam'?80:60)){o.alive=false;break;}
    if(dist(o,t)<.45&&t.side===o.side){o.alive=false;stats.ff++;event('impact',t.x,t.y);
      if(t.hp!=null){t.hp=Math.max(0,t.hp-12);logMsg('damage',`Friendly fire: ${o.name} hit ${t.name}. Damage ${Math.round(100-t.hp)}%.`,t.x,t.y);if(t.hp<=0)killObj(t,'friendly fire');}
      else{logMsg('damage',`Friendly fire: ${o.name} hit ${t.name}.`,t.x,t.y);killObj(t,'friendly fire');}
      if(pauseOnLaunch){paused=true;showBanner(`Friendly fire: ${o.name} hit ${t.name}. One missile in ${Math.round(1/opt.ff).toLocaleString()} is set to go astray.`);syncPlay();}
      break;}
    if(dist(o,t)<.45){o.alive=false;const pk=o.kind==='sam'?(t.kind==='asm'?.72:.8):(t.kind==='asm'||t.kind==='uav'?.55:.62);
      if(rnd()<pk){killObj(t);if(t.kind==='asm'||t.kind==='uav'){stats.intercepts++;event('intercept',t.x,t.y);}else event('kill',t.x,t.y);t.alive=false;}
      else{t.engagedBy=null;event('miss',t.x,t.y);}}
  }break;
  }
}
function impact(m,ship,dmg){m.alive=false;stats.hits++;ship.hp=Math.max(0,ship.hp-dmg);event('impact',ship.x,ship.y);
  logMsg('damage',`${ship.name} hit by ${m.kind==='uav'?'drone':'missile'} ${m.name}. Damage ${Math.round(100-ship.hp)}%.`,ship.x,ship.y);
  if(m.kind==='uav')stats.exp.red.Drones++;

function shipsFire(){
  const vips=vipList();
  for(const s of objs){
    if(!s.alive||s.side!=='blue'||(s.kind!=='ddg'&&s.kind!=='cvn'))continue;
    if(s.doctrine==='Hold'||s.emcon==='Passive')continue;
    let inflight=0;for(const m of objs)if(m.alive&&m.kind==='sam'&&m.shooter===s.id)inflight++;
    let free=s.channels-inflight;if(free<=0)continue;
    const c=[];
    for(const t of objs){
      if(!t.alive||t.side!=='red')continue;
      if(t.engagedBy&&byId.get(t.engagedBy)?.alive)continue;
      const msl=t.kind==='asm'||t.kind==='uav';
      if(!msl){if(s.doctrine==='Tight'&&t.idState!=='hostile')continue;if(t.idState==='unknown')continue;}
      const d=dist(s,t),r=t.alt<100?38:(posture==='Proactive'?90:60);
      if(d<=r)c.push([d,t,vips.length&&threatensVip(t,vips)?0:1]);
    }
    c.sort((a,b)=>a[2]-b[2]||a[0]-b[0]);
    if(s.order&&s.order.type==='attack'){const pt=byId.get(s.order.target);
      if(pt&&pt.alive&&!(pt.engagedBy&&byId.get(pt.engagedBy)?.alive)&&dist(s,pt)<=(pt.alt<100?38:60)){const i=c.findIndex(x=>x[1]===pt);if(i>=0)c.splice(i,1);c.unshift([dist(s,pt),pt]);}}
    for(const [d,t] of c){if(free<=0)break;
      let w=null;if(d<=22&&s.mag.ESSM&&s.mag.ESSM[0]>0)w='ESSM';else if(s.mag['SM-2']&&s.mag['SM-2'][0]>0)w='SM-2';else if(d<=22&&s.mag.ESSM&&s.mag.ESSM[0]>0)w='ESSM';
      if(!w)continue;s.mag[w][0]--;stats.exp.blue[w]++;launch('sam',s,t,w);report(s,w,1);free--;
      if(s.mag[w][0]===0)logMsg('weapons',`${s.name}: ${w} magazine empty.`,s.x,s.y);}
  }
}
function ciws(dt){

    for(const t of objs){if(!t.alive||(t.kind!=='asm'&&t.kind!=='uav'))continue;if(dist(s,t)<1.8&&rnd()<.5*dt){t.alive=false;stats.ciws++;stats.exp.blue.CIWS++;event('ciws',t.x,t.y);report(s,'CIWS',1);}}}
}

  for(const o of objs){if(!o.alive||!o.stealth||o.seen)continue;
    const s=objs.find(b=>b.alive&&b.side==='blue'&&!K[b.kind].missile&&dist(b,o)<(b.kind==='aew'?40:b.kind==='ucav'?18:b.kind==='ftr'?25:30));
    if(s){o.seen=true;o.idState='hostile';logMsg('contact',`Stealth contact: ${s.name}'s own radar detected ${o.name} at ${dist(s,o).toFixed(1)} km, bearing ${pad3(brgOf(byId.get(1),o))} from Kestrel. It was not on the shared picture.`,o.x,o.y);}}

  const zf=Math.max(.55,Math.min(1.9,Math.pow(view.scale/3,.32)));

  const vis=list.filter(it=>it.sx>-60&&it.sx<W+60&&it.sy>-60&&it.sy<H+60);

      let c=cells.get(key);if(!c){c={k,n:0,x:0,y:0};cells.set(key,c);}c.n++;c.x+=it.sx;c.y+=it.sy;grouped.add(it);}
    for(const c of cells.values())pills.push({label:(c.k==='asm'?'MSL ×':'UAV ×')+c.n,x:c.x/c.n,y:c.y/c.n});}

const TF=[['all','All',o=>true],['air','Aircraft',o=>K[o.kind].domain==='air'&&!K[o.kind].missile],['msl','Missiles',o=>K[o.kind].missile],['ships','Ships & subs',o=>K[o.kind].domain!=='air'],['threat','Inbound',o=>o.side==='red'&&(o.kind==='asm'||o.kind==='uav')]];
function renderTrackChips(){const l=buildList();$('#trackChips').innerHTML=TF.map(([k,n,f])=>`<button class="chip" data-f="${k}" aria-pressed="${k===trackFilter}">${n}<i>${l.filter(it=>f(it.o)).length}</i></button>`).join('');}
function ownGroups(){const m=new Map();for(const o of objs){if(!o.alive||o.side!=='blue'||K[o.kind].missile)continue;if(!m.has(o.group))m.set(o.group,[]);m.get(o.group).push(o);}return m;}
let slots={},grpSeq=0;
function makeGroup(name,ids){const units=ids.map(i=>byId.get(i)).filter(u=>u&&u.alive&&u.side==='blue'&&!K[u.kind].missile);
  if(!units.length){toast('Select some of your own units first.');return null;}
  units.forEach(u=>u.group=name);logMsg('orders',`New group "${name}": ${units.length} units (${units.slice(0,6).map(u=>u.name).join(', ')}${units.length>6?'…':''}).`,units[0].x,units[0].y);
  toast(`Group "${name}" created with ${units.length} units. Right-click or right-drag on the plot to send it.`);renderGroupChips();renderUnit();return name;}
function renderGroupChips(){const m=ownGroups();const air=[...m.values()].flat().filter(o=>K[o.kind].domain==='air');const keyOf=n=>Object.keys(slots).find(k=>slots[k]===n);
  $('#groupChips').innerHTML=`<span class="lbl" style="align-self:center;margin-right:4px">Select group</span>`+[...m.entries()].map(([k,v])=>`<button class="chip" data-g="${esc(k)}">${keyOf(k)?`<b>${keyOf(k)}</b>`:''}${esc(k)}<i>${v.length}</i></button>`).join('')+`<button class="chip" data-g="__air">All aircraft<i>${air.length}</i></button>`;}
function selectGroup(name){const m=ownGroups();const list=name==='__air'?[...m.values()].flat().filter(o=>K[o.kind].domain==='air'):(m.get(name)||[]);if(!list.length)return;
  sel.clear();list.forEach(o=>sel.add(o.id));primary=list[0].id;renderUnit();renderTracks();toast(`${list.length} units selected. Right-click the plot to send them, or right-click a hostile to attack its group.`);}
$('#groupChips').addEventListener('click',e=>{const b=e.target.closest('button');if(b)selectGroup(b.dataset.g);});
cv.addEventListener('dblclick',e=>{const it=pick(e.offsetX,e.offsetY);if(!it||it.o.group==null)return;
  if(it.o.side==='blue')selectGroup(it.o.group);else{sel.clear();objs.filter(x=>x.alive&&x.side==='red'&&x.group===it.o.group&&!K[x.kind].missile).forEach(x=>sel.add(x.id));primary=it.o.id;renderUnit();renderTracks();}});
$('#trackChips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;trackFilter=b.dataset.f;renderTrackChips();renderTracks(true);});
function renderTracks(){
  const c=byId.get(1);const f=TF.find(x=>x[0]===trackFilter)[2];
  const l=buildList().filter(it=>f(it.o)).map(it=>({it,d:dist(c,it)})).sort((a,b)=>a.d-b.d).slice(0,160);
  $('#trackCount').textContent=`${buildList().length} live`;
  $('#trackBody').innerHTML=l.map(({it,d})=>{const o=it.o,a=affOf(o);return `<tr data-id="${o.id}" class="${sel.has(o.id)?'sel':''}"><td><span class="sw ${a}"></span>${esc(o.name)}</td><td title="${K[o.kind].cls}">${CODE[o.kind]}</td><td class="n">${pad3(brgOf(c,it))}</td><td class="n">${d.toFixed(1)}</td><td class="n">${altText(o)||'—'}</td><td class="n">${Math.round(o.spd*1000)}</td></tr>`;}).join('');
}
$('#trackBody').addEventListener('click',e=>{const tr=e.target.closest('tr');if(!tr)return;const id=+tr.dataset.id;sel.clear();sel.add(id);primary=id;renderUnit();renderTracks();});
$('#trackBody').addEventListener('dblclick',e=>{const tr=e.target.closest('tr');if(!tr)return;center(byId.get(+tr.dataset.id));});

function symCanvas(o){const c=document.createElement('canvas');const d=Math.min(2,devicePixelRatio||1);c.width=40*d;c.height=40*d;c.style.width='40px';c.style.height='40px';const x=c.getContext('2d');x.scale(d,d);
  const prev=g;g=x;const aff=affOf(o),col=COL[aff];x.translate(20,20);x.strokeStyle=col;x.fillStyle=rgba(col,.16);x.lineWidth=1.6;
  if(K[o.kind].missile){g=prev;x.translate(-20,-20);x.save();x.translate(20,20);x.fillStyle=col;x.strokeStyle=col;x.beginPath();x.moveTo(12,0);x.lineTo(-9,8);x.lineTo(-4,0);x.lineTo(-9,-8);x.closePath();o.side==='red'?x.fill():x.stroke();x.restore();return c;}
  framePath(aff,K[o.kind].domain,15);x.fill();x.stroke();x.fillStyle=col;x.font=`600 ${K[o.kind].glyph.length>2?9:12}px ${F_UI}`;x.textAlign='center';x.textBaseline='middle';x.fillText(K[o.kind].glyph,0,K[o.kind].domain==='air'?2:K[o.kind].domain==='sub'?-2:0);g=prev;return c;}
function renderUnit(){
  const el=$('#unit');const ids=[...sel].filter(id=>byId.get(id));
  if(!ids.length){el.innerHTML=`<div class="unit"><p class="note">Click a track on the plot or in the list. Shift-click adds to the selection. [ and ] shrink or enlarge the selected symbols.</p></div>`;return;}
  const o=byId.get(primary&&sel.has(primary)?primary:ids[0]);const c=byId.get(1);const blue=o.side==='blue';
  const ctrlCls=(o.ctrl==='Manual'||o.ctrl==='Order')?'manual':o.ctrl==='Agent'?'agent':'';
  let ctrlTxt=o.ctrl==='Order'?(!o.order?'Your order':o.order.type==='attack'?'Your order · attack':o.order.type==='rtb'?'Your order · RTB · '+({transit:'inbound',marshal:'in the marshal stack',approach:'landing'}[o.order.phase]||''):o.order.type==='track'?'Your order · racetrack':o.order.type==='defend'?(o.order.rtb?'Your order · RTB to station':'Your order · protect '+(byId.get(o.order.unit)?.name||'')):o.order.type==='route'?'Your order · route':'Your order · move'):o.ctrl==='Manual'?'Manual · you':o.ctrl==='Agent'?'Agent':o.ctrl==='Mission'?'Mission':o.ctrl==='Script'?'Script':'BDArmory AI';
  if(o.diverted&&byId.get(o.diverted)?.alive)ctrlTxt+=' · engaging '+byId.get(o.diverted).name;
  let h=`<div class="unit"><div class="uh"><span id="symSlot"></span><div><h3>${esc(o.name)}</h3><p>${K[o.kind].cls} · ${blue?'Blue':'Red'}${o.alive?'':o.deck!=null?` · on deck${o.ready?' · ready':' · rearming'}`:' · <span class="win">lost</span>'}</p></div></div>`;
  if(ids.length>1)h+=`<p class="note">${ids.length} tracks selected. Size buttons apply to all of them.</p>`;
  if(ids.length>1&&ids.some(i=>byId.get(i).side==='blue'))h+=`<div class="sec"><span class="lbl">Make a group from the selection</span><div class="ctl"><input id="grpName" placeholder="Group name, e.g. Strike A" autocomplete="off"><button class="btn acc" data-act="mkgroup">Make group</button></div><span class="note">Tip: Alt+1…9 puts the selection on a number key. Press the number to select the group again.</span></div>`;
  if(blue){h+=`<div class="ctl"><span class="cstate ${ctrlCls}">${ctrlTxt}</span><span class="note">${esc(o.mission||'')}</span></div>
    <div class="ctl">${(o.ctrl==='Manual'||o.ctrl==='Order')?`<button class="btn acc" data-act="release">Return to mission</button>`:`<button class="btn acc" data-act="take">Take control</button>`}<button class="btn" data-act="send" aria-pressed="${pendingMove}">Send to…</button><button class="btn" data-act="vip" aria-pressed="${!!o.vip}">${o.vip?'VIP ✓':'Mark VIP'}</button><button class="btn ghost" data-act="fly">Fly in KSP</button><button class="btn ghost" data-act="center">Center</button></div>
    <p class="note">Right-click the plot to send the selected units there. Right-click a hostile to attack it. Right-click one of your own units to make the selection protect it. V marks the selection as VIP. Shift-drag to box-select several units.</p>`;}
  else h+=`<div class="ctl"><span class="cstate" style="color:${o.idState==='unknown'?COL.unknown:COL.hostile}">${o.idState==='unknown'?'Unknown':'Hostile'}</span><button class="btn ghost" data-act="center">Center</button></div>`;
  h+=`<div class="kv"><div><span class="lbl">Brg</span><b>${pad3(brgOf(c,o))}</b></div><div><span class="lbl">Rng km</span><b>${dist(c,o).toFixed(1)}</b></div><div><span class="lbl">${K[o.kind].domain==='sub'?'Depth':'Alt'}</span><b>${altText(o)||'surface'}</b></div>
    <div><span class="lbl">Hdg</span><b>${pad3(hdgDeg(o))}</b></div><div><span class="lbl">Speed</span><b>${Math.round(o.spd*1000)} m/s</b></div><div><span class="lbl">RCS m²</span><b>${K[o.kind].rcs>=1?Math.round(K[o.kind].rcs).toLocaleString():K[o.kind].rcs}</b></div></div>`;
  if(K[o.kind].missile){const tg=byId.get(o.target);if(tg)h+=`<div class="sec"><span class="lbl">Engagement</span><span>Target <b>${esc(tg.name)}</b> · time to go ${Math.round(dist(o,tg)/o.spd)} s</span></div>`;}
  if(o.mag){h+=`<div class="sec"><span class="lbl">Magazine</span>`+Object.entries(o.mag).map(([k,v])=>`<div class="mag"><span>${k}</span><span class="bar"><i style="width:${100*v[0]/v[1]}%"></i></span><span class="r ${v[0]===0?'win':''}">${v[0]===0?'empty':v[0]+'/'+v[1]}</span></div>`).join('')+`</div>`;}
  if(o.aam!=null)h+=`<div class="sec"><span class="lbl">Weapons &amp; fuel</span><div class="mag"><span>AAM</span><span class="bar"><i style="width:${100*o.aam/(o.aamMax||6)}%"></i></span><span class="r ${o.aam===0?'win':''}">${o.aam}/${o.aamMax||6}</span></div><div class="mag"><span>Fuel</span><span class="bar"><i style="width:${o.fuel*100}%"></i></span><span class="r">${Math.round(o.fuel*100)}%</span></div></div>`;
  if(o.fuel!=null&&o.aam==null)h+=`<div class="sec"><span class="lbl">Fuel</span><div class="mag"><span>Fuel</span><span class="bar"><i style="width:${o.fuel*100}%"></i></span><span class="r">${Math.round(o.fuel*100)}%</span></div></div>`;
  if(o.hp!=null)h+=`<div class="sec"><span class="lbl">Damage</span><div class="mag"><span>Hull</span><span class="bar dmg"><i style="width:${100-o.hp}%"></i></span><span class="r">${Math.round(100-o.hp)}%</span></div></div>`;
  if(blue&&o.alive&&!K[o.kind].missile){h+=`<div class="sec"><span class="lbl">Orders for the selection</span><div class="ctl"><button class="btn acc" data-act="rtb">RTB &amp; land</button><button class="btn" data-act="track" aria-pressed="${pendingTrack}">Racetrack…</button></div><span class="note">R sends the selection home: aircraft stack at the marshal point astern of Kestrel and land one at a time; ships return to station. T, then drag on the plot, sets a racetrack patrol: with weapons Free (guard) aircraft leave the pattern to fight anything they detect, then come back. The top-bar RTB all button (or Shift+R twice) sends every aircraft home.</span></div>`;}
  if(blue&&o.kind==='cvn'){const dk=deckOf(o),rd=dk.filter(x=>x.ready).length;h+=`<div class="sec"><span class="lbl">Flight deck</span><span>${dk.length?`<b>${dk.length}</b> aircraft on deck, <b>${rd}</b> ready`:'Deck empty'}${dk.length>rd?` · ${dk.length-rd} rearming (90 s)`:''}</span>${dk.length?`<span class="note">${esc(dk.slice(0,12).map(x=>x.name).join(', '))}${dk.length>12?'…':''}</span>`:''}<div class="ctl"><button class="btn acc" data-act="launch" ${rd?'':'disabled'}>Launch ready aircraft</button></div></div>`;}
  if(blue&&o.doctrine){h+=`<div class="sec"><span class="lbl">Weapons control</span><div class="seg" data-doc>${['Free','Tight','Hold'].map(d=>`<button data-v="${d}" aria-pressed="${o.doctrine===d}">${d}</button>`).join('')}</div>
     ${o.emcon?`<span class="lbl" style="margin-top:6px">Radar</span><div class="seg" data-emcon>${['Active','Passive'].map(d=>`<button data-v="${d}" aria-pressed="${o.emcon===d}">${d}</button>`).join('')}</div>
     <span class="note">Hold or passive radar stops SAM fire. Close-in guns keep defending the ship.</span>`:`<span class="note">Free = guard mode: hunts and engages hostiles, and leaves a patrol to fight what it detects. Tight = assigned targets and close threats only. Hold = passive: stays on its pattern and does not fire.</span>
     <span class="lbl" style="margin-top:6px">When a new hostile appears during an order</span><div class="seg" data-oc>${[['task','Stay on task'],['engage','Engage on contact']].map(([v,l])=>`<button data-v="${v}" aria-pressed="${(o.onContact||'task')===v}">${l}</button>`).join('')}</div>
     <span class="note">Stay on task: go straight for the assigned target and ignore others crossing the path. Engage on contact: attack any hostile the unit's own radar detects on the way (even one the shared picture missed), then continue the order.</span>`}</div>`;}
  h+=`<div class="sec"><span class="lbl">Symbol size</span><div class="ctl"><button class="btn ghost" data-act="smaller">Smaller</button><button class="btn ghost" data-act="larger">Larger</button><button class="btn ghost" data-act="sizereset">Reset</button><span class="note">×${o.sizeMul.toFixed(2)}</span></div></div></div>`;
  el.innerHTML=h;$('#symSlot').replaceWith(symCanvas(o));
}
$('#unit').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const ids=[...sel];const o=byId.get(primary&&sel.has(primary)?primary:ids[0]);if(!o)return;
  const a=b.dataset.act;
  if(a==='take'){for(const id of ids){const u=byId.get(id);if(u.side==='blue'){if(u.ctrl!=='Order'&&u.ctrl!=='Manual')u.prevCtrl=u.ctrl;u.order=null;u.ctrl='Manual';}}logMsg('orders',`You took control of ${ids.map(i=>byId.get(i).name).join(', ')}. The mission is suspended, not cancelled.`,o.x,o.y);}
  else if(a==='release'){for(const id of ids){const u=byId.get(id);if(u.ctrl==='Manual'||u.ctrl==='Order')releaseUnit(u);}logMsg('orders',`${o.name} returned to ${o.mission}. The mission re-plans from the unit's position.`,o.x,o.y);}
  else if(a==='mkgroup'){const v=($('#grpName')||{}).value;makeGroup((v||'').trim()||`Group ${String.fromCharCode(65+(grpSeq++%26))}`,ids);document.activeElement&&document.activeElement.blur();}
  else if(a==='vip'){toggleVip();return;}
  else if(a==='rtb'){issueRtb(ids.map(i=>byId.get(i)));return;}
  else if(a==='rtball'){rtbAll();return;}
  else if(a==='track'){pendingTrack=!pendingTrack;tdrag=null;if(pendingTrack)toast('Racetrack: drag on the plot along the long leg. A plain click makes a 20 km leg pointing east. Esc cancels.');}
  else if(a==='launch'){launchDeck(o);return;}
  else if(a==='send'){pendingMove=!pendingMove;if(pendingMove)toast('Click the plot where the selected units should go, or click a hostile to attack it.');}
  else if(a==='fly'){toast(`In the real build this makes ${o.name} the active vessel in KSP so you can fly it yourself. The map keeps tracking it.`);}
  else if(a==='center')center(o);
  else if(a==='larger')sizeSel(1.25);else if(a==='smaller')sizeSel(.8);else if(a==='sizereset')sizeSel(0);
  if(b.closest('[data-doc]')||b.closest('[data-oc]')){const doc=!!b.closest('[data-doc]'),us=ids.map(i=>byId.get(i)).filter(u=>u&&u.side==='blue'&&u.doctrine);
    us.forEach(u=>{if(doc)u.doctrine=b.dataset.v;else u.onContact=b.dataset.v;});
    const nm=us.length>4?us.length+' units':us.map(u=>u.name).join(', ');
    logMsg('orders',doc?`${nm}: weapons ${b.dataset.v.toLowerCase()}${b.dataset.v==='Free'?' (guard)':b.dataset.v==='Hold'?' (passive)':''}.`:`${nm}: ${b.dataset.v==='engage'?'engage any hostile detected during orders':'stay on task during orders'}.`,o.x,o.y);}
  if(b.closest('[data-emcon]')){o.emcon=b.dataset.v;logMsg('orders',`${o.name}: radar ${o.emcon.toLowerCase()}.`,o.x,o.y);}
  renderUnit();});

let tab='log';const LC=[['contact','Contacts'],['weapons','Weapons'],['intercept','Intercepts'],['damage','Damage & losses'],['orders','Orders'],['comms','Comms']];
const logOn=new Set(LC.map(x=>x[0]));let commsCh='All';
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{tab=t.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));if(tab==='comms')unread=0;dirtyBot=true;renderBot(true);}));
$('#logChips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(tab==='log'){const k=b.dataset.c;logOn.has(k)?logOn.delete(k):logOn.add(k);}else if(tab==='comms')commsCh=b.dataset.c;dirtyBot=true;renderBot(true);});
function fmtT(t){const s=UT0+t;const h=Math.floor(s%21600/3600),m=Math.floor(s%3600/60),ss=Math.floor(s%60);return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;}
let botScrollLock=false;
function renderBot(force){
  $('#unread').textContent=unread&&tab!=='comms'?unread:'';
  if(!dirtyBot&&!force)return;dirtyBot=false;
  const chips=$('#logChips'),body=$('#botBody');
  if(tab==='log'){chips.hidden=false;chips.innerHTML=LC.map(([k,n])=>`<button class="chip" data-c="${k}" aria-pressed="${logOn.has(k)}">${n}<i>${log.filter(l=>l.cat===k).length}</i></button>`).join('');
    body.innerHTML=`<ul class="log">`+log.filter(l=>logOn.has(l.cat)).slice(-200).reverse().map((l,i)=>`<li data-x="${l.x??''}" data-y="${l.y??''}" data-t="${l.t}"><span class="t">${fmtT(l.t)}</span><span class="c c-${l.cat}">${l.cat}</span><span class="m">${esc(l.text)}</span></li>`).join('')+`</ul>`;}
  else if(tab==='comms'){chips.hidden=false;const chs=['All','Team','Diplomatic','Broadcast'];chips.innerHTML=chs.map(c=>`<button class="chip" data-c="${c}" aria-pressed="${c===commsCh}">${c}<i>${c==='All'?comms.length:comms.filter(m=>m.ch===c).length}</i></button>`).join('');
    const list=comms.filter(m=>commsCh==='All'||m.ch===commsCh);
    const listHtml=list.length?list.slice().reverse().map(m=>`<div class="msg ${m.side==='you'?'you':m.side}"><div class="who">${esc(m.who)}<small>${m.ch} · ${fmtT(m.t)}</small>${m.unv?'<span class="unv">Unverified sender</span>':''}</div><div class="body">${esc(m.text)}</div></div>`).join(''):'<p class="note" style="padding:10px">No messages yet. Team reports and enemy transmissions appear here.</p>';
    const existing=$('#commsList');if(existing){existing.innerHTML=listHtml;return;}
    body.innerHTML=`<div class="comms"><div id="commsList" style="overflow:auto;min-height:0">${listHtml}</div>
      <form class="compose" id="compose"><select id="cch" aria-label="Channel"><option>Team</option><option>Diplomatic</option><option>Broadcast</option></select><input id="cmsg" placeholder="Message as Blue commander" autocomplete="off"><button class="btn acc">Send</button></form></div>`;
    $('#compose').addEventListener('submit',e=>{e.preventDefault();const v=$('#cmsg').value.trim();if(!v)return;comms.push({t:simT,ch:$('#cch').value,who:'Blue commander (you)',side:'you',text:v});
      logMsg('comms',`You (${$('#cch').value}): ${v}`,null,null);if($('#cch').value==='Diplomatic')setTimeout(()=>sayComms('Diplomatic','Red commander','red','Message received. Your position is noted. Our terms stand.'),2500);dirtyBot=true;renderBot(true);});}
  else{chips.hidden=true;const L=s=>{const e=Object.entries(stats.lost[s]);return e.length?e.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join(''):'<dt>None</dt><dd>0</dd>';};
    body.innerHTML=`<div class="loss"><section><h4 style="color:${COL.friend}">Blue</h4><dl>${L('blue')}<dt>&nbsp;</dt><dd></dd>${Object.entries(stats.exp.blue).map(([k,v])=>`<dt>${k==='CIWS'?'CIWS kills':k+' fired'}</dt><dd>${v}</dd>`).join('')}<dt>Missiles intercepted</dt><dd>${stats.intercepts+stats.ciws}</dd><dt>Hits taken</dt><dd>${stats.hits}</dd><dt>Friendly-fire incidents</dt><dd>${stats.ff}</dd></dl></section>
      <section><h4 style="color:${COL.hostile}">Red</h4><dl>${L('red')}<dt>&nbsp;</dt><dd></dd><dt>Anti-ship missiles fired</dt><dd>${stats.exp.red.ASM}</dd><dt>Drones expended</dt><dd>${stats.exp.red.Drones}</dd><dt>Leak rate</dt><dd>${stats.exp.red.ASM?Math.round(100*stats.hits/(stats.exp.red.ASM+stats.exp.red.Drones||1))+'%':'—'}</dd></dl></section></div>`;}
}
$('#botBody').addEventListener('click',e=>{const li=e.target.closest('li[data-t]');if(!li)return;const x=li.dataset.x,y=li.dataset.y;if(x!==''){view.cx=+x;view.cy=+y;view.scale=Math.max(view.scale,8);}

/* panel toggles + splitters + layout memory */
const app=$('#app');
function store(){try{localStorage.setItem('skz-layout',JSON.stringify({lw:app.style.getPropertyValue('--lw'),rw:app.style.getPropertyValue('--rw'),bh:app.style.getPropertyValue('--bh'),off:['left','right','bot'].filter(p=>app.classList.contains('no-'+p))}));}catch(e){}}
function restore(){try{const s=JSON.parse(localStorage.getItem('skz-layout')||'null');if(!s)return;for(const k of ['lw','rw','bh'])if(s[k])app.style.setProperty('--'+k,s[k]);(s.off||[]).forEach(p=>setPanel(p,false,true));}catch(e){}}
function setPanel(p,on,quiet){app.classList.toggle('no-'+p,!on);document.querySelector(`.top .tg[data-panel="${p}"]`).setAttribute('aria-pressed',on);if(!quiet)store();}
document.querySelectorAll('.top .tg[data-panel]').forEach(b=>b.addEventListener('click',()=>setPanel(b.dataset.panel,app.classList.contains('no-'+b.dataset.panel))));
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>setPanel(b.dataset.close,false)));
$('#resetLayout').onclick=()=>{['lw','rw','bh'].forEach(k=>app.style.removeProperty('--'+k));['left','right','bot'].forEach(p=>setPanel(p,true,true));store();};
document.querySelectorAll('[data-split]').forEach(sp=>{
  sp.addEventListener('pointerdown',e=>{sp.setPointerCapture(e.pointerId);const k=sp.dataset.split;const r=app.getBoundingClientRect();
    const mv=ev=>{let v;if(k==='lw')v=ev.clientX-r.left;else if(k==='rw')v=r.right-ev.clientX;else v=r.bottom-ev.clientY;
      v=Math.max(k==='bh'?110:220,Math.min(k==='bh'?r.height*.6:r.width*.4,v));app.style.setProperty('--'+k,v+'px');};
    const up=()=>{sp.removeEventListener('pointermove',mv);sp.removeEventListener('pointerup',up);store();};
    sp.addEventListener('pointermove',mv);sp.addEventListener('pointerup',up);});
  sp.addEventListener('keydown',e=>{const k=sp.dataset.split;const cur=parseFloat(getComputedStyle(app).getPropertyValue('--'+k))||300;let d=0;
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')d=k==='lw'?-20:20;if(e.key==='ArrowRight'||e.key==='ArrowDown')d=k==='lw'?20:-20;if(!d)return;e.preventDefault();app.style.setProperty('--'+k,Math.max(110,cur+d)+'px');store();});
});

/* timeline ticks */
function drawTicks(){const c=$('#ticks');const r=c.getBoundingClientRect();const d=Math.min(2,devicePixelRatio||1);if(c.width!==Math.round(r.width*d)){c.width=Math.round(r.width*d);c.height=Math.round(6*d);}
  const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,6);if(!frames.length)return;const t0=frames[0].t,t1=Math.max(t0+1,frames[frames.length-1].t);
  for(const e of events){if(e.type!=='impact'&&e.type!=='kill'&&e.type!=='intercept')continue;x.fillStyle=e.type==='impact'?COL.crit:e.type==='kill'?COL.text:rgba(COL.ok,.6);x.fillRect((e.t-t0)/(t1-t0)*r.width,0,1.5,e.type==='intercept'?3:6);}}

/* ---------- main loop ---------- */
let last=performance.now(),uiT=0;
function renderAll(){renderGroupChips();renderTrackChips();renderTracks();renderUnit();renderBot(true);}
function frame(now){
  const dt=Math.min(.3,(now-last)/1000);last=now;
  if(!paused&&replayIdx==null)simulate(dt*speed);
  draw();
  const t=curT();$('#ut').textContent=(()=>{const s=UT0+t;const d=Math.floor(s/21600)+1;return `Y1 D${String(d).padStart(3,'0')} ${fmtT(t)}`;})();
  $('#tlTime').textContent=`T+${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
  uiT+=dt;if(uiT>.4){uiT=0;renderGroupChips();renderTrackChips();renderTracks();if(!document.activeElement||!$('#unit').contains(document.activeElement))renderUnit();renderBot();drawTicks();}
  requestAnimationFrame(frame);
}
restore();setup();resize();
requestAnimationFrame(()=>{resize();fitAll();renderAll();requestAnimationFrame(frame);});
})();
</script>
